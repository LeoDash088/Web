<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari Umamusume</title>
</head>
<body>
    <header>


    </header>
    <main>
    <form action="">
        <label for="Nom-complet">Nombre completo:</label>
        <input id="Nom-complet" type="text">

        <label for="gmail">Correu electronic:</label>
        <input type="email" id="gmail">

        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña">

        <label for="valoracio">De el 1 al 10 que tan fan eres de Umamusume</label>
        <input type="number" id="valoracio" min="1" max="10">

        <label for="telefono">Contactanos con tu telefono:</label>
        <input type="tel" id="telefono">

        
        <select name="Umamusume-Favorita" id="Fav-Uma">
            <option value="" selected disabled>Selecciona tu favorita</option>
            <option value="Meisho Doto">Meisho Doto</option>
            <option value="Agnes Tachyon">Agnes Tachyon</option>
            <option value="Haru Urara">Haru Urara</option>
            <option value="Rice Shower">Rice Shower</option>
            <option value="Special Week">Special Week</option>
            <option value="Oguri Cap">Oguri Cap</option>
            <option value="Otros">Otros</option>
        </select>


    </form>
    </main>
    <footer>


    </footer>
</body>
</html>
