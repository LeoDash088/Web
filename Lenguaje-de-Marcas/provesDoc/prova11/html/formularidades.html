    <h1>FORMULARI</h1>
    <form action="">
        <label for="Nom">Insereix el teu nom:</label>
        <input type="text" required id="nom">
        <br>
        <label for="email">Introdueix la teva direccio email:</label>
        <input type="email" id="email">
        <br>
        <label>Insereix la teva contraseña</label>
        <input type="password" minlength="8" required>
        <br>
        <label>Insereix el teu telefon aqui:</label>
        <input type="tel" pattern="[0-9]{9}" required>
        <label>Numero favorit de l'1 al 100</label>
        <input type="number" min="1" max="100" step="1">


    </form>
